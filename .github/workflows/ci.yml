name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.12 · Ruff · Black · Mypy · Pytest)
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (CPU-only torch; tests don't need CUDA)
        run: |
          uv sync --extra dev --no-install-package torch
          uv pip install --torch-backend=cpu torch

      - name: Lint with Ruff
        run: uv run ruff check backend tests

      - name: Format check with Black
        run: uv run black --check backend tests

      - name: Type check with Mypy
        run: uv run mypy backend tests

      - name: Run Pytest suite
        run: uv run pytest -v -p no:cacheprovider

  web:
    name: Web UI (Node 20 · TypeScript · Vite Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check & build production bundle
        run: npm run build
